<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whitfield Clinic — Diabetes Risk Assessment</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
    --cream:#f7f3ea;
    --panel:#fffdf8;
    --ink:#2b2620;
    --ink-soft:#7a7264;
    --gold:#a9812f;
    --gold-deep:#8a6a24;
    --line:#ddd3bd;
    --hunter:#3c4b3a;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Jost',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 20px;
}

.card{
    width:100%;
    max-width:720px;
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow:0 30px 60px -20px rgba(43,38,32,0.18);
    position:relative;
}

.card::before{
    content:"";
    position:absolute;
    inset:14px;
    border:1px solid var(--gold);
    opacity:.5;
    pointer-events:none;
}

.inner{
    padding:56px 56px 46px;
}

.crest{
    text-align:center;
    margin-bottom:18px;
}

.crest svg{
    width:46px;
    height:46px;
}

.eyebrow{
    text-align:center;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:2.6rem;
    letter-spacing:0.01em;
    line-height:1.15;
}

.subtitle{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.05rem;
    color:var(--ink-soft);
    margin-top:8px;
    margin-bottom:8px;
}

.rule{
    width:64px;
    height:1px;
    background:var(--gold);
    margin:26px auto 34px;
}

form{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:28px;
    row-gap:22px;
}

.input-group{
    display:flex;
    flex-direction:column;
    position:relative;
}

label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
}

input{
    width:100%;
    padding:8px 2px 10px;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    font-family:'Cormorant Garamond',serif;
    font-size:1.2rem;
    color:var(--ink);
    outline:none;
    transition:border-color .35s ease;
}

input::placeholder{
    color:#c9bfa8;
    font-style:italic;
}

input:focus{
    border-bottom:1px solid var(--gold);
}

.predict-btn{
    grid-column:span 2;
    margin-top:16px;
    padding:16px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .35s ease;
}

.predict-btn:hover{
    background:transparent;
    color:var(--ink);
}

.result{
    margin-top:32px;
    padding:26px;
    text-align:center;
    border:1px solid var(--gold);
    position:relative;
}

.result .result-label{
    display:block;
    font-size:10px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin-bottom:10px;
}

.result .result-value{
    font-family:'Cormorant Garamond',serif;
    font-size:1.7rem;
    font-weight:600;
    color:var(--hunter);
}

.footer-text{
    text-align:center;
    color:var(--ink-soft);
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-top:40px;
}

.footer-text span{
    display:block;
    margin-top:4px;
    font-size:9px;
    letter-spacing:0.08em;
    color:#a89f8c;
}

@media(max-width:640px){
    .inner{padding:42px 26px 36px;}
    form{grid-template-columns:1fr;}
    .predict-btn{grid-column:span 1;}
    h1{font-size:2.1rem;}
}
</style>
</head>

<body>

<div class="card">
    <div class="inner">

        <div class="crest">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="22" stroke="#a9812f" stroke-width="1"/>
                <path d="M24 12 L24 36 M14 20 Q24 14 34 20 M14 28 Q24 34 34 28" stroke="#a9812f" stroke-width="1" fill="none"/>
            </svg>
        </div>

        <div class="eyebrow">The Whitfield Clinic</div>
        <h1>Diabetes Risk Assessment</h1>
        <p class="subtitle">A private screening, attentively considered</p>

        <div class="rule"></div>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="input-group">
                <label>Pregnancies</label>
                <input type="number" name="Pregnancies" placeholder="—" required>
            </div>

            <div class="input-group">
                <label>Glucose Level</label>
                <input type="number" name="Glucose" placeholder="—" required>
            </div>

            <div class="input-group">
                <label>Blood Pressure</label>
                <input type="number" name="BloodPressure" placeholder="—" required>
            </div>

            <div class="input-group">
                <label>Skin Thickness</label>
                <input type="number" name="SkinThickness" placeholder="—" required>
            </div>

            <div class="input-group">
                <label>Insulin</label>
                <input type="number" name="Insulin" placeholder="—" required>
            </div>

            <div class="input-group">
                <label>Body Mass Index</label>
                <input type="number" step="0.01" name="BMI" placeholder="—" required>
            </div>

            <div class="input-group">
                <label>Pedigree Function</label>
                <input type="number" step="0.01" name="DiabetesPedigreeFunction" placeholder="—" required>
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" name="Age" placeholder="—" required>
            </div>

            <button class="predict-btn" type="submit">Request Assessment</button>

        </form>

        {% if result %}
        <div class="result">
            <span class="result-label">Assessment Outcome</span>
            <div class="result-value">{{ result }}</div>
        </div>
        {% endif %}

        <div class="footer-text">
            Powered by Flask &amp; Machine Learning
            <span>This is a screening estimate, not a clinical diagnosis</span>
        </div>

    </div>
</div>

</body>
</html>
